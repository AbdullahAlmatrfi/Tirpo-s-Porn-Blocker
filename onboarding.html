<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Welcome to Tirpo's Porn Blocker</title>
    <style>
      :root { color-scheme: light; --texture-color: rgba(2, 6, 23, 0.03); }
      body {
        margin: 0; font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Inter, Roboto, sans-serif;
        color: #0f172a; background-color: #ffffff;
        /* Subtle white chevron texture */
        background-image:
          linear-gradient(135deg, var(--texture-color) 25%, transparent 25%),
          linear-gradient(225deg, var(--texture-color) 25%, transparent 25%),
          linear-gradient(315deg, var(--texture-color) 25%, transparent 25%),
          linear-gradient(45deg, var(--texture-color) 25%, transparent 25%);
        background-position: -8px 0, -8px 0, 0 0, 0 0;
        background-size: 16px 16px;
        background-repeat: repeat;
      }
      .wrap {
        min-height: 100vh; display: grid; place-items: center; padding: 24px;
      }
      .card {
        width: 100%; max-width: 980px; background: #fff; border-radius: 20px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06); padding: 32px;
        display: grid; gap: 24px; grid-template-columns: 1.2fr 1fr;
      }
      .art {
        aspect-ratio: 16/9; border-radius: 16px; background: #f8fafc; display:flex; align-items:center; justify-content:center;
      }
      .art img { width: 360px; border-radius: 24px; }
      .steps h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.01em; }
      .steps p.lead { margin: 0 0 16px; color: #475569; }
      /* Steps list */
      ol { margin: 12px 0 0; padding-left: 0; color: #334155; }
      ol { list-style: none; counter-reset: step; }
      li { display: flex; align-items: center; gap: 10px; line-height: 1.6; margin: 12px 0; }
      li::before { counter-increment: step; content: counter(step) "-"; color: #475569; width: 22px; text-align: right; margin-right: 6px; }
      .hint { margin-top: 16px; font-size: 13px; color: #64748b; }
      .icon-badge {
        display: inline-flex; align-items: center; justify-content: center;
        width: 28px; height: 28px; border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #ffffff 0%, #f5f7fa 60%, #eef2f7 100%);
        color: #6b7280; vertical-align: -6px;
        box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
        margin: 0 4px;
      }
      .icon-badge img { width: 18px; height: 18px; display: inline; }
      .icon-badge svg { width: 16px; height: 16px; display: none; }
      @media (max-width: 840px) {
        .card { grid-template-columns: 1fr; padding: 24px; }
        .art { order: -1; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card" role="region" aria-label="Getting started">
        <div class="art" aria-hidden="true">
          <img src="icons/onboarding.gif" alt="" style="max-width: 100%; height: auto; object-fit: contain;" onerror="this.src='icons/icon128.png'" />
        </div>
        <div class="steps">
          <h1>Get started in three steps</h1>
          <p class="lead">Pin the extension so it’s always one click away.</p>
          <ol>
            <li>
              Click the extensions icon
              <span class="icon-badge" aria-label="Extensions menu" role="img">
                <img src="icons/puzzle.svg" alt="" onerror="this.remove(); this.nextElementSibling.style.display='inline'" />
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="#6B7280" d="M10.9 3.5h2.2c.5 0 .9.4.9.9v.9c0 .4.3.7.7.7h.9c.9 0 1.6.7 1.6 1.6s-.7 1.6-1.6 1.6h-.9c-.4 0-.7.3-.7.7v.9c0 1.5-1.2 2.7-2.7 2.7s-2.7-1.2-2.7-2.7v-.9c0-.4-.3-.7-.7-.7h-.9C4.8 9.2 4 8.5 4 7.6s.7-1.6 1.6-1.6h.9c.4 0 .7-.3.7-.7v-.9c0-.5.4-.9.9-.9h2.2z"/>
                </svg>
              </span>
              in Chrome’s toolbar.
            </li>
            <li>
              Press the
              <span class="icon-badge" aria-label="Pin icon" role="img">
                <img src="icons/pin.svg" alt="" onerror="this.remove(); this.nextElementSibling.style.display='inline'" />
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path fill="#6B7280" d="M14.5 3l-1 4.5 3 3L12 12l-5.5 6 6-5.5 1.5-4.5 3-3L14.5 3z"/>
                </svg>
              </span>
              pin icon.
            </li>
            <li>Click the Tirpo's Porn Blocker icon to open the popup and start blocking.</li>
          </ol>
          
        </div>
      </div>
    </div>
  </body>
</html>
